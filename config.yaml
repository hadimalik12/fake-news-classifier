# Shared constants for the Deep Truth experiment.
# Training code reads this file. Do not duplicate these values in scripts.
# q1, q2, pad_length, and distilbert max_length are filled by ./scripts/prepare_data.sh.
# External data is downloaded by ./scripts/download_data.sh and is not committed.

seed: 42

dataset:
  name: LIAR
  urls:
    - "https://www.cs.ucsb.edu/~william/data/liar_dataset.zip"
  archive_path: data/raw/liar/liar_dataset.zip
  archive_sha256: "611c1addad919743dde15822b87a60bfb760d8f85597f25289e34621800654c7"
  files:
    train: train.tsv
    validation: valid.tsv
    test: test.tsv

embeddings:
  glove:
    urls:
      - "https://downloads.cs.stanford.edu/nlp/data/glove.6B.zip"
      - "https://nlp.stanford.edu/data/glove.6B.zip"
    archive_path: data/external/glove/glove.6B.zip
    archive_sha256: "617afb2fe6cbd085c235baf7a465b96f4112bd7f7ccb2b2cbd649fed9cbcf2fb"
    file: glove.6B.100d.txt
    path: data/external/glove/glove.6B.100d.txt
    dimensions: 100
    vocabulary_size: 400000

metric:
  average: macro
  zero_division: 0
  comparison_decimals: 4
  early_stopping_min_delta: 0.0001

labels:
  - "pants-fire"
  - "false"
  - "barely-true"
  - "half-true"
  - "mostly-true"
  - "true"

columns:
  id: 0
  label: 1
  statement: 2

splits:
  train:
    path: data/raw/liar/train.tsv
    examples: 10269
  validation:
    path: data/raw/liar/valid.tsv
    examples: 1284
  test:
    path: data/raw/liar/test.tsv
    examples: 1283

predictions:
  directory: results/predictions
  columns:
    - id
    - statement
    - word_count
    - length_bin
    - label
    - prediction

runs:
  all:
    - tfidf_logreg
    - bilstm
    - distilbert_frozen
    - distilbert_finetuned
  model_comparison:
    - tfidf_logreg
    - bilstm
    - distilbert_finetuned
  fine_tuning:
    - distilbert_frozen
    - distilbert_finetuned

length_bins:
  names:
    - short
    - medium
    - long
  quantile_method: linear
  probabilities:
    - "1/3"
    - "2/3"
  q1: 14
  q2: 20

adjacent_labels:
  - ["pants-fire", "false"]
  - ["false", "barely-true"]
  - ["barely-true", "half-true"]
  - ["half-true", "mostly-true"]
  - ["mostly-true", "true"]

selection:
  monitor: macro_f1
  tie_break:
    - {field: macro_f1, order: desc, split: validation}
    - {field: accuracy, order: desc, split: validation}
    - {field: learning_rate, order: asc}
    - {field: batch_size, order: asc}
    - {field: max_features, order: asc}
    - {field: ngram_range, order: asc}
    - {field: min_df, order: asc}
    - {field: C, order: asc}
    - {field: hidden_size, order: asc}
    - {field: dropout, order: asc}

tfidf:
  lowercase: true
  analyzer: word
  norm: l2
  use_idf: true
  solver: lbfgs
  max_iter: 2000
  grid:
    ngram_range:
      - [1, 1]
      - [1, 2]
    min_df: [2, 5]
    max_features: [10000, 50000]
    C: [0.1, 1.0, 10.0]

bilstm:
  min_token_count: 2
  embedding_dim: 100
  oov_mean: 0.0
  oov_std: 0.05
  pad_token: "<pad>"
  unk_token: "<unk>"
  pad_percentile: 95
  pad_length_floor: 8
  pad_length: 33
  truncate_end: true
  weight_decay: 0.0
  grad_clip: 1.0
  max_epochs: 15
  patience: 3
  grid:
    learning_rate: [0.001, 0.0001]
    hidden_size: [64, 128]
    dropout: [0.3, 0.5]
    batch_size: [32, 64]

distilbert:
  model_name: distilbert-base-uncased
  num_labels: 6
  problem_type: single_label_classification
  max_length_percentile: 99
  max_length_if_percentile_at_most_64: 64
  max_length_otherwise: 128
  max_length: 64
  weight_decay: 0.01
  grad_clip: 1.0
  finetuned_warmup_ratio: 0.1
  frozen:
    max_epochs: 10
    patience: 2
    constant_learning_rate: true
    grid:
      learning_rate: [0.001, 0.0005, 0.0001]
      batch_size: [16, 32]
  finetuned:
    max_epochs: 4
    patience: 2
    constant_learning_rate: false
    grid:
      learning_rate: [0.00002, 0.00003, 0.00005]
      batch_size: [16, 32]
